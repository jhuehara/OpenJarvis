/* =====================================================================
   Modo conversa — mãos livres; o chat mostra só o que foi falado
   ===================================================================== */
const VOICE_PROMPT = 'Você está numa conversa por voz: sua resposta será lida em voz alta. ' +
  'Responda em português do Brasil, de forma natural e breve (1 a 3 frases, salvo se pedirem detalhes), ' +
  'sem markdown, listas, emojis, tabelas ou blocos de código.';
const GOODBYE = /^\s*(tchau|até (logo|mais)|encerrar( a)? conversa|pode (parar|desligar)|desligar)\b[\s,.!]*(jarvis)?[\s.!]*$/i;

const chatEl = document.getElementById('chat');
const convEl = document.getElementById('conversation');
const talkBar = document.getElementById('talkBar');
const talkStatus = document.getElementById('talkStatus');
const talkHint = document.getElementById('talkHint');
const talkOrb = document.getElementById('talkOrb');
const talkBtn = document.getElementById('talkBtn');

const talk = {
  on: false, mic: null, phase: 'off', timer: null, recorder: null, chunks: [],
  floor: 0.01, voiceSince: 0, silentSince: 0, startedAt: 0, armedAt: 0,
  turn: 0,   // cada interrupção/encerramento invalida o turno em andamento

  async start() {
    if (this.on) return;
    if (!ttsOn) setSound(true, { persist: false });
    try { this.mic = await openMic(); }
    catch (err) { addMessage('bot', micHelp(err)).classList.add('err'); return; }
    this.on = true;
    chatEl.classList.add('talk'); chatEl.classList.remove('collapsed');
    talkBtn.classList.add('on'); talkBtn.setAttribute('aria-pressed', 'true');
    document.getElementById('chatTitle').textContent = 'Conversa';
    if (!convEl.children.length) convEl.innerHTML = '<div class="talk-hello" id="talkHello"><b>MODO CONVERSA</b>Fale naturalmente — eu escuto, respondo em voz<br>e aqui fica só o que dissermos.</div>';
    this.calibrate();
  },

  stop() {
    if (!this.on) return;
    this.on = false; this.turn++;
    clearInterval(this.timer);
    this.disarm();
    this.mic?.close(); this.mic = null;
    speaker.stop();
    view.voice = 0;
    chatEl.classList.remove('talk');
    talkBtn.classList.remove('on'); talkBtn.setAttribute('aria-pressed', 'false');
    document.getElementById('chatTitle').textContent = 'Canal';
    this.setPhase('off');
    if (view.state === 'listening') setState('idle');
  },

  setPhase(phase, status, hint) {
    this.phase = phase;
    talkBar.dataset.phase = phase;
    if (status) talkStatus.textContent = status;
    talkHint.textContent = hint ?? 'Diga “tchau, Jarvis” para encerrar';
  },

  // Mede o ruído ambiente por meio segundo para ajustar a sensibilidade
  calibrate() {
    this.setPhase('calibrating', 'Ajustando ao ambiente…', 'Um instante de silêncio');
    const samples = [];
    const t0 = performance.now();
    const id = setInterval(() => {
      if (!this.on) return clearInterval(id);
      samples.push(micLevel(this.mic.analyser, this.mic.buf));
      if (performance.now() - t0 > 600) {
        clearInterval(id);
        samples.sort((a, b) => a - b);
        this.floor = samples[Math.floor(samples.length / 2)] || 0.01;
        this.listen();
      }
    }, 30);
  },

  listen() {
    if (!this.on) return;
    this.setPhase('listening', 'Pode falar…');
    setState('listening');
    const threshold = Math.max(0.022, this.floor * 3);
    clearInterval(this.timer);
    this.voiceSince = 0;
    this.arm();
    this.timer = setInterval(() => {
      const level = micLevel(this.mic.analyser, this.mic.buf);
      view.voice = Math.min(1, level * 6);
      talkOrb.style.setProperty('--lvl', Math.min(1, level * 8).toFixed(2));
      const now = performance.now();
      if (this.phase === 'listening') {
        if (level > threshold) {
          this.voiceSince ||= now;
          if (now - this.voiceSince > 90) this.beginRecording(now);   // ignora estalos curtos
        } else {
          this.voiceSince = 0;
          if (now - this.armedAt > 8000) this.arm();   // descarta silêncio acumulado
        }
      } else if (this.phase === 'recording') {
        if (level > threshold * 0.8) this.silentSince = now;
        const long = now - this.startedAt > 30000;
        if (now - this.silentSince > 1200 || long) this.finishRecording();
      }
    }, 30);
  },

  // O gravador já roda enquanto escuta: assim o início da fala ("sim", "Jarvis…")
  // não é cortado pelo tempo que o detector leva para perceber a voz
  arm() {
    this.disarm();
    this.chunks = [];
    this.recorder = new MediaRecorder(this.mic.stream);
    this.recorder.ondataavailable = e => this.chunks.push(e.data);
    this.recorder.start();
    this.armedAt = performance.now();
  },

  disarm() {
    if (this.recorder?.state === 'recording') { this.recorder.onstop = null; this.recorder.stop(); }
    this.recorder = null;
  },

  beginRecording(now) {
    if (!this.recorder) this.arm();
    this.startedAt = this.silentSince = now;
    this.setPhase('recording', 'Ouvindo…', 'Pausa de um segundo e eu respondo');
  },

  finishRecording() {
    const recorder = this.recorder, duration = performance.now() - this.startedAt;
    clearInterval(this.timer);
    view.voice = 0; talkOrb.style.setProperty('--lvl', 0);
    this.setPhase('busy', 'Transcrevendo…', 'Toque no círculo para cancelar');
    const chunks = this.chunks;
    this.recorder = null;             // a próxima escuta arma um gravador novo
    recorder.onstop = () => this.handleUtterance(new Blob(chunks, { type: recorder.mimeType || 'audio/webm' }), duration);
    recorder.stop();
  },

  async handleUtterance(blob, duration) {
    if (!this.on) return;
    if (duration < 450) return this.listen();          // ruído, não fala
    const turn = this.turn;
    setState('thinking');
    let text = '';
    try { text = await transcribe(blob); }
    catch (err) { this.say('bot', `Não consegui transcrever: ${err.message}`); setState('error', 4000); return this.listen(); }
    if (!this.on || turn !== this.turn) return;
    if (!text || WHISPER_PHANTOMS.test(text)) return this.listen();

    document.getElementById('talkHello')?.remove();
    this.say('user', text);
    if (GOODBYE.test(text)) {
      const bye = 'Até logo. Estarei por aqui.';
      this.say('bot', bye);
      setState('affection', 6000);
      speaker.say(bye);
      await speaker.drained();
      return this.stop();
    }
    const decision = playPrompt.check(text);
    if (decision) {
      const reply = decision === 'yes' ? 'Reproduzindo.' : decision === 'no' ? playPrompt.declineText() : playPrompt.unclearText();
      history.push({ role: 'user', content: text }, { role: 'assistant', content: reply });
      this.say('bot', reply);
      this.setPhase('busy', 'Jarvis falando…', '');
      speaker.say(reply);
      await speaker.drained();
      if (!this.on || turn !== this.turn) return;
      if (decision === 'yes') { mediaBox.play(); return; }   // play() pausa a escuta
      return this.listen();
    }
    await this.reply(text, turn);
    if (this.on && turn === this.turn) this.listen();
  },

  async reply(text, turn) {
    busy = true; sendBtn.disabled = true;
    history.push({ role: 'user', content: text });
    illuminate(text, 1.2);
    view.mood = 'idle';
    this.setPhase('busy', 'Pensando…', 'Toque no círculo para interromper');

    const line = this.say('bot', '');
    const said = line.querySelector('.text');
    line.classList.add('pending');
    let pending = '', shown = false, queued = false;
    const show = sentence => {
      if (!shown) { line.classList.remove('pending'); shown = true; }
      said.querySelectorAll('.now').forEach(e => e.classList.remove('now'));
      const span = document.createElement('span');
      span.className = 'said now';
      span.textContent = `${sentence} `;
      said.appendChild(span);
      convEl.scrollTop = convEl.scrollHeight;
      if (this.phase === 'busy') this.setPhase('busy', 'Jarvis falando…', 'Toque no círculo para interromper');
    };
    // Frases completas (terminador seguido de espaço) vão para a fila de fala
    const flush = final => {
      pending = pending.replace(TAG_RE, ' ');
      // Uma marcação [[…]] ainda incompleta fica retida até fechar
      const open = pending.indexOf('[[');
      let held = '';
      if (open !== -1) { held = pending.slice(open); pending = pending.slice(0, open); }
      const re = /[.!?…]+["”')\]]*\s+|\n+/g;
      const ready = [];
      let last = 0, m;
      while ((m = re.exec(pending))) { ready.push(pending.slice(last, m.index + m[0].length)); last = m.index + m[0].length; }
      pending = pending.slice(last) + held;
      if (final) { ready.push(pending.replace(/\[\[[^\]]*$/, '')); pending = ''; }
      ready.forEach(s => { const clean = spokenText(s); if (clean) { queued = true; speaker.say(clean, () => show(clean)); } });
    };

    try {
      const answer = await streamReply([{ role: 'system', content: `${GALAXY_PROMPT}\n${VOICE_PROMPT}` }, ...history], {
        onDelta: delta => { if (turn !== this.turn) return; pending += delta; flush(false); },
        onEvent: (name, data) => handleAgentEvent(name, data, t => this.setPhase('busy', t, 'Toque no círculo para interromper')),
      });
      if (turn !== this.turn) { history.push({ role: 'assistant', content: answer }); return; }
      flush(true);
      if (!answer.trim()) { line.remove(); history.pop(); return; }
      const clean = afterReply(text, answer);
      if (!queued && clean) speaker.say(clean, () => show(clean));   // resposta só com mídia
      await speaker.drained();
      said.querySelectorAll('.now').forEach(e => e.classList.remove('now'));
    } catch (err) {
      line.remove();
      history.pop();
      this.say('bot', `Não consegui responder: ${err.message}`);
      setState('error', 5000);
    } finally {
      busy = false; sendBtn.disabled = false;
    }
  },

  // Mídia tocando: o microfone pausa para o Jarvis não "ouvir" a música
  pauseForMedia() {
    if (!this.on) return;
    clearInterval(this.timer);
    this.disarm();
    view.voice = 0; talkOrb.style.setProperty('--lvl', 0);
    this.setPhase('paused', 'Reproduzindo mídia', 'Toque no círculo para pausar e voltar a conversar');
  },

  // Interrompe a fala ou a resposta em andamento e volta a ouvir
  interrupt() {
    if (this.on && this.phase === 'paused') { mediaBox.pause(); this.listen(); return; }
    if (!this.on || this.phase !== 'busy') return;
    this.turn++;
    speaker.stop();
    convEl.querySelector('.line.bot:last-child .now')?.classList.remove('now');
    setState('idle');
    this.listen();
  },

  // Fala algo fora de uma resposta (ex.: a pergunta da caixa de mídia) sem
  // deixar o microfone ouvir a própria voz do Jarvis
  async announce(text) {
    if (!this.on) return;
    this.say('bot', text);
    if (this.phase === 'busy' || this.phase === 'recording') { speaker.say(text); return; }   // entra na fila atual
    const turn = ++this.turn;
    clearInterval(this.timer);
    this.disarm();
    this.setPhase('busy', 'Jarvis falando…', 'Responda “sim” ou “não”');
    speaker.say(text);
    await speaker.drained();
    if (this.on && turn === this.turn && this.phase === 'busy') this.listen();
  },

  say(role, text) {
    const el = document.createElement('div');
    el.className = `line ${role}`;
    el.innerHTML = `<div class="who">${role === 'user' ? 'Você' : 'Jarvis'}</div><div class="text"></div>`;
    el.querySelector('.text').textContent = text;
    convEl.appendChild(el);
    convEl.scrollTop = convEl.scrollHeight;
    return el;
  },
};

talkBtn.onclick = () => (talk.on ? talk.stop() : talk.start());
document.getElementById('talkEnd').onclick = () => talk.stop();
talkOrb.onclick = () => talk.interrupt();
addEventListener('keydown', ev => { if (ev.key === 'Escape' && talk.on) talk.stop(); });

/* =====================================================================
   Caixa de mídia — imagens e vídeos que o Jarvis traz
   ===================================================================== */
const mediaEl = document.getElementById('media');
const mediaStage = document.getElementById('mediaStage');
const mediaKind = document.getElementById('mediaKind');
const mediaCaption = document.getElementById('mediaCaption');
const mediaLink = document.getElementById('mediaLink');

function classifyUrl(url) {
  const yt = url.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if (yt) return { type: 'youtube', id: yt[1] };
  const vm = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (vm) return { type: 'vimeo', id: vm[1] };
  if (/^https?:\/\/(www\.|m\.)?soundcloud\.com\/[^/?#]+\/[^?#]+/.test(url)) return { type: 'soundcloud', src: url };
  let path = ''; try { path = new URL(url).pathname.toLowerCase(); } catch { return null; }
  if (/\.(jpe?g|png|gif|webp|avif|svg|bmp)$/.test(path)) return { type: 'image', src: url };
  if (/\.(mp4|webm|mov|m4v|ogv)$/.test(path)) return { type: 'video', src: url };
  if (/\.(mp3|m4a|aac|ogg|oga|opus|wav|flac)$/.test(path)) return { type: 'audio', src: url };
  return null;
}

async function resolveOnServer(url) {
  const r = await fetch(`/v1/media/resolve?url=${encodeURIComponent(url)}`, { headers: headers() });
  if (!r.ok) return null;
  const d = await r.json();
  return d.type && d.type !== 'none' ? d : null;
}

function loadImage(src) {
  return new Promise((ok, fail) => {
    const img = new Image();
    img.referrerPolicy = 'no-referrer';
    img.onload = () => ok(img); img.onerror = fail;
    img.src = src;
  });
}

// Descobre o que exibir para um item; null se não houver mídia utilizável
async function prepare(item) {
  let res = classifyUrl(item.url);
  if (!res) res = await resolveOnServer(item.url).catch(() => null);
  if (!res) return null;
  if (res.type === 'image') {
    try { await loadImage(res.src); }
    catch {
      // Não era o arquivo (ex.: página "File:….jpg") ou o link falhou: o servidor descobre
      const alt = await resolveOnServer(item.url).catch(() => null);
      if (!alt || alt.type === 'none') return null;
      if (alt.type === 'image') {
        if (alt.src === res.src) return null;
        try { await loadImage(alt.src); } catch { return null; }
      }
      res = alt;
    }
  }
  return { ...res, kind: item.kind, caption: item.caption || res.title || '', page: item.url };
}

const mediaBox = {
  items: [], index: 0, token: 0,

  async open(requested) {
    const token = ++this.token;
    this.items = []; this.index = 0;
    mediaEl.hidden = false; document.body.classList.add('media-open');
    mediaEl.style.animation = 'none'; void mediaEl.offsetWidth; mediaEl.style.animation = '';
    mediaKind.textContent = 'BUSCANDO';
    mediaStage.className = 'media-stage';
    mediaStage.innerHTML = '<div class="media-loading">Buscando mídia…</div>';
    mediaCaption.textContent = ''; mediaLink.hidden = true;
    this.updateNav();
    emitWave(1.3); view.burst = 1.5;

    // Mostra a primeira que ficar pronta, sem esperar as outras
    const jobs = requested.slice(0, 6).map(it => prepare(it));
    let shown = false;
    jobs.forEach((job, order) => job.then(res => {
      if (token !== this.token || !res) return;
      res.order = order;
      this.items.push(res);
      this.items.sort((a, b) => a.order - b.order);
      if (!shown) { shown = true; this.index = this.items.indexOf(res); this.render({ ask: true }); }
      else this.updateNav();
    }));
    await Promise.allSettled(jobs);
    if (token !== this.token) return;
    if (!this.items.length) {
      mediaKind.textContent = 'MÍDIA';
      mediaStage.innerHTML = '<div class="media-fail">Não consegui carregar essa mídia.</div>';
      mediaLink.href = requested[0].url; mediaLink.hidden = false;
      mediaCaption.textContent = requested[0].caption || '';
    }
  },

  render({ ask = false } = {}) {
    const it = this.items[this.index];
    if (!it) return;
    const playable = isPlayable(it);
    mediaStage.className = `media-stage${playable ? ` video ${it.type}` : ''}`;
    mediaStage.innerHTML = '';
    if (it.type === 'image') {
      const img = document.createElement('img');
      img.referrerPolicy = 'no-referrer';
      img.alt = it.caption || 'Imagem trazida pelo Jarvis';
      img.src = it.src;
      mediaStage.appendChild(img);
    } else if (it.type === 'video' || it.type === 'audio') {
      // Nada toca sozinho: o Jarvis pergunta antes
      const el = document.createElement(it.type);
      el.src = it.src; el.controls = true; el.preload = 'metadata';
      if (it.type === 'video') el.playsInline = true;
      else mediaStage.insertAdjacentHTML('beforeend', `<div class="audio-card"><span>♪</span><b>${escapeHtml(it.caption || 'Música')}</b></div>`);
      el.addEventListener('play', () => { this.playing = true; this.hideAsk(); talk.pauseForMedia(); });
      el.addEventListener('pause', () => { this.playing = false; });
      mediaStage.appendChild(el);
    } else {
      mediaStage.insertAdjacentHTML('beforeend', `<iframe src="${embedUrl(it, false)}" title="${escapeHtml(it.caption || 'Mídia')}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`);
    }
    if (playable) {
      mediaStage.insertAdjacentHTML('beforeend', `<div class="play-ask" id="playAsk">
        <button type="button" class="play-yes">▶ ${it.type === 'audio' || it.type === 'soundcloud' || it.kind === 'audio' ? 'Tocar' : 'Reproduzir'}</button>
        <button type="button" class="play-no">Agora não</button></div>`);
      mediaStage.querySelector('.play-yes').onclick = () => {
        const msg = this.play();
        if (!talk.on) addMessage('bot', msg);
      };
      mediaStage.querySelector('.play-no').onclick = () => { playPrompt.clear(); this.hideAsk(); };
      if (ask) playPrompt.ask(it);
    }
    this.playing = false;
    mediaCaption.textContent = it.caption;
    mediaLink.href = it.page || it.src; mediaLink.hidden = false;
    this.updateNav();
  },

  hideAsk() { mediaStage.querySelector('.play-ask')?.remove(); },

  // Inicia a mídia atual; devolve a frase de confirmação
  play() {
    const it = this.items[this.index];
    playPrompt.clear();
    if (!it || !isPlayable(it)) return 'Não há nada para reproduzir agora.';
    this.hideAsk();
    speaker.stop();                       // a mídia não disputa com a voz do Jarvis
    const el = mediaStage.querySelector('video, audio');
    const frame = mediaStage.querySelector('iframe');
    if (el) el.play().catch(() => {});
    else if (frame) frame.src = embedUrl(it, true);
    this.playing = true;
    talk.pauseForMedia();
    emitWave(1.2); view.burst = 1.2;
    return `▶ Reproduzindo${it.caption ? ` “${it.caption}”` : ''}.`;
  },

  pause() {
    const it = this.items[this.index];
    this.playing = false;
    const el = mediaStage.querySelector('video, audio');
    if (el) { el.pause(); return; }
    const frame = mediaStage.querySelector('iframe');
    if (!frame || !it) return;
    const msg = it.type === 'youtube' ? { event: 'command', func: 'pauseVideo', args: [] } : { method: 'pause' };
    frame.contentWindow?.postMessage(JSON.stringify(msg), '*');
  },

  updateNav() {
    const n = this.items.length, it = this.items[this.index];
    const kind = !it ? 'BUSCANDO' : it.type === 'image' ? 'IMAGEM' : mediaNoun(it).toUpperCase();
    if (it) mediaKind.textContent = n > 1 ? `${kind} ${this.index + 1}/${n}` : kind;
    document.getElementById('mediaPrev').hidden = document.getElementById('mediaNext').hidden = n < 2;
  },

  step(d) {
    if (this.items.length < 2) return;
    this.index = (this.index + d + this.items.length) % this.items.length;
    this.render();
  },

  close() {
    this.token++;
    playPrompt.clear();
    mediaStage.innerHTML = '';        // para vídeos em reprodução
    this.playing = false;
    mediaEl.hidden = true; mediaEl.classList.remove('big');
    document.body.classList.remove('media-open');
    if (talk.on && talk.phase === 'paused') talk.listen();
  },
};

function isPlayable(it) { return ['youtube', 'vimeo', 'soundcloud', 'video', 'audio'].includes(it?.type); }
function mediaNoun(it) { return it.kind === 'audio' || it.type === 'audio' || it.type === 'soundcloud' ? 'música' : 'vídeo'; }

function embedUrl(it, autoplay) {
  const a = autoplay ? 1 : 0;
  if (it.type === 'youtube') return `https://www.youtube-nocookie.com/embed/${it.id}?autoplay=${a}&rel=0&modestbranding=1&playsinline=1&enablejsapi=1`;
  if (it.type === 'vimeo') return `https://player.vimeo.com/video/${it.id}?autoplay=${a}`;
  if (it.type === 'soundcloud') return `https://w.soundcloud.com/player/?url=${encodeURIComponent(it.src)}&auto_play=${!!autoplay}&visual=true&show_comments=false`;
  return it.src;
}

/* Pergunta "quer que eu reproduza?" e interpreta a resposta (texto ou voz) */
const YES_RE = /^(sim|s|pode|podes|claro|quero|toca|toque|tocar|reproduz\w*|executa\w*|inicia\w*|comeca|play|bora|vai|manda|ok|okay|isso|por favor|com certeza|aham|uhum|yes|yep|beleza|positivo|afirmativo)\b/;
const NO_RE = /^(nao|n|agora nao|depois|deixa|no|nope|cancela\w*|negativo|nem)\b/;
const playPrompt = {
  pending: null,
  ask(it) {
    const noun = mediaNoun(it);
    const q = noun === 'música'
      ? `Quer que eu toque ${it.caption ? `“${it.caption}”` : 'a música'}?`
      : `Quer que eu reproduza o vídeo${it.caption ? ` “${it.caption}”` : ''}?`;
    this.pending = { it, at: Date.now() };
    if (talk.on) talk.announce(q);
    else { addMessage('bot', q); if (ttsOn) speaker.say(q); }
    history.push({ role: 'assistant', content: q });
  },
  // 'yes' | 'no' | 'unclear' | null (a mensagem não é uma resposta à pergunta)
  check(text) {
    if (!this.pending) return null;
    if (Date.now() - this.pending.at > 5 * 60_000 || mediaEl.hidden) { this.clear(); return null; }
    const t = text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                  .replace(/[^a-z0-9 ]+/g, ' ').replace(/\b(jarvis|ah|eh|hum|entao|olha)\b/g, ' ').replace(/\s+/g, ' ').trim();
    const words = t ? t.split(' ') : [];
    let answer = NO_RE.test(t) ? 'no' : YES_RE.test(t) ? 'yes' : null;
    // Respostas de uma palavra que a transcrição distorceu ("sinta", "sin", "nã")
    if (!answer && words.length === 1) {
      if (/^si\w{0,3}$|^ss+$/.test(words[0])) answer = 'yes';
      else if (/^na\w{0,2}$|^no\w?$/.test(words[0])) answer = 'no';
    }
    if (!answer && words.length <= 2 && !this.pending.retried) { this.pending.retried = true; return 'unclear'; }
    if (answer === 'no') { this.clear(); mediaBox.hideAsk(); }
    if (answer === 'yes') this.clear();
    if (!answer) this.clear();          // mudou de assunto: segue a conversa normal
    return answer;
  },
  unclearText() {
    return this.pending && mediaNoun(this.pending.it) === 'música'
      ? 'Não entendi. Quer que eu toque a música? Responda sim ou não.'
      : 'Não entendi. Quer que eu reproduza o vídeo? Responda sim ou não.';
  },
  declineText() { return 'Tudo bem. Fica aqui na caixa se quiser ver depois.'; },
  clear() { this.pending = null; },
};
document.getElementById('mediaPrev').onclick = () => mediaBox.step(-1);
document.getElementById('mediaNext').onclick = () => mediaBox.step(1);
document.getElementById('mediaClose').onclick = () => mediaBox.close();
document.getElementById('mediaBig').onclick = () => mediaEl.classList.toggle('big');
addEventListener('keydown', ev => {
  if (mediaEl.hidden || talk.on || ev.target.closest?.('textarea, input')) return;
  if (ev.key === 'Escape') { mediaEl.classList.contains('big') ? mediaEl.classList.remove('big') : mediaBox.close(); }
  if (ev.key === 'ArrowLeft') mediaBox.step(-1);
  if (ev.key === 'ArrowRight') mediaBox.step(1);
});

/* =====================================================================
   Legenda + inicialização
   ===================================================================== */
document.getElementById('legend').innerHTML = '<div class="legend-title">REAÇÕES</div>' +
  LEGEND.map(k => `<span><i style="color:${PALETTES[k].hot};background:radial-gradient(circle at 35% 35%, ${PALETTES[k].hot}, ${PALETTES[k].deep})"></i>${PALETTES[k].label}</span>`).join('');

// Gancho para depuração/automação: window.jarvisGalaxy.setState('tool')
window.jarvisGalaxy = { setState, emitWave, talk, mediaBox, parseReply, history };

requestAnimationFrame(frame);
setState('thinking');
Promise.all([loadModel(), loadGraph()]).then(() => {
  setState('idle');
  emitWave(1.5);
});
setInterval(() => { if (!busy) loadGraph(); }, 60000);
input.focus();
</script>
